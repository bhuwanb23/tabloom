# TABLOOM — optional Blueprint for a Static Site
# Manual deploy: New → Static Site, then use the settings below.
# Do NOT set `plan` — static sites have no compute instance type.

services:
  - type: web
    name: tabloom
    runtime: static
    rootDir: tabloom-game-development-setup
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
