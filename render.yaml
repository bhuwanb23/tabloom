# TABLOOM — Render Static Site
# Dashboard: New → Blueprint → connect this repo
# Or: New → Static Site → Root Directory = tabloom-game-development-setup

services:
  - type: web
    name: tabloom
    runtime: static
    plan: free
    rootDir: tabloom-game-development-setup
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
