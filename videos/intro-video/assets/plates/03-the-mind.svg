<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="40%" stop-color="#07090F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#07090F"/>
  
  <defs>
    <radialGradient id="mind" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#F4EBD0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F4EBD0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="960" cy="420" rx="280" ry="360" fill="url(#mind)"/>
  <ellipse cx="960" cy="400" rx="90" ry="160" fill="#F4EBD0" opacity="0.25"/>
  <ellipse cx="960" cy="280" rx="70" ry="80" fill="#F4EBD0" opacity="0.35"/>
  <ellipse cx="1020" cy="420" rx="18" ry="40" fill="#E8E2D4" opacity="0.12"/>
  <ellipse cx="979" cy="506" rx="18" ry="40" fill="#E8E2D4" opacity="0.12"/>
  <ellipse cx="911" cy="473" rx="18" ry="40" fill="#E8E2D4" opacity="0.12"/>
  <ellipse cx="911" cy="367" rx="18" ry="40" fill="#E8E2D4" opacity="0.12"/>
  <ellipse cx="979" cy="334" rx="18" ry="40" fill="#E8E2D4" opacity="0.12"/>
  <path d="M200 540 Q960 420 1720 540" fill="none" stroke="#F4EBD0" stroke-width="3" opacity="0.7"/>
  <path d="M200 560 Q960 680 1720 560" fill="none" stroke="#C9A227" stroke-width="2" opacity="0.4"/>
  <text x="160" y="100" font-family="monospace" font-size="20" fill="#C9A227" letter-spacing="8">THE MIND THAT REMEMBERS</text>
  <text x="160" y="980" font-family="monospace" font-size="18" fill="#8A8496" letter-spacing="6">VEIL OF SEVERANCE</text>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" filter="url(#grain)"/>
