      const tl = gsap.timeline({ paused: true });
      gsap.set("#shot-02,#shot-03,#shot-04,#shot-05,#shot-06,#shot-07,#shot-08,#shot-09,#shot-10", { opacity: 0 });
      const fades = [
        ["#shot-01", "#shot-02", 5.6, 0.7, "sine.inOut"],
        ["#shot-02", "#shot-03", 18.6, 0.7, "sine.inOut"],
        ["#shot-03", "#shot-04", 31.6, 0.7, "sine.inOut"],

        ["#shot-07", "#shot-08", 90.6, 0.7, "sine.inOut"],
        ["#shot-08", "#shot-09", 100.1, 0.35, "power4.inOut"],
        ["#shot-09", "#shot-10", 108.8, 0.4, "power2.inOut"],
      ];
      fades.forEach(([outId, inId, t, dur, ease], i) => {
        tl.to(outId, { opacity: 0, duration: dur, ease }, t);
        tl.fromTo(inId, { opacity: 0 }, { opacity: 1, duration: dur, ease }, t);
        if (i === 7) {
          tl.fromTo(inId, { filter: "contrast(1.35) saturate(1.25)" }, { filter: "none", duration: 0.45, ease: "power2.out" }, t);
        }
      });
      tl.to("#bgm", { volume: 0.16, duration: 0.4 }, 19);
      tl.to("#bgm", { volume: 0.26, duration: 0.5 }, 66);
      tl.to("#bgm", { volume: 0.14, duration: 0.3 }, 109);
